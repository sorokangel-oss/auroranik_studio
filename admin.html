<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>오로라닉 관리자</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
:root{--bg:#090d19;--panel:#12182a;--line:#293149;--gold:#d8b26b;--text:#f5f4ef;--muted:#9ea7bb;--danger:#ee7777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans KR',sans-serif}button,input,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 20%,#3a3166,transparent 35%)}.card{width:min(430px,100%);padding:36px;background:#11172aee;border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 70px #0007}h1,h2,h3{margin-top:0}.brand{letter-spacing:.18em;color:var(--gold);font-weight:700}.hint,.status{color:var(--muted);font-size:13px}.field{display:grid;gap:8px;margin:18px 0}.field label{font-size:12px;color:#c4cada}.field input,.field textarea{width:100%;padding:13px 14px;color:#fff;background:#0b1020;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:100px;resize:vertical}.primary,.ghost,.danger{border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}.primary{background:var(--gold);color:#151827}.ghost{background:#202941;color:#fff}.danger{background:#4a2028;color:#ffb7b7}.login .primary{width:100%}.app header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 4vw;background:#090d19e8;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.header-actions{display:flex;gap:8px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 70px)}aside{padding:30px 20px;border-right:1px solid var(--line)}aside a{display:block;padding:11px 12px;color:var(--muted);font-size:14px}aside a:hover{color:#fff}main{padding:40px 5vw 100px;max-width:1100px}.section{padding:28px;margin-bottom:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.project{padding:20px;margin:16px 0;background:#0d1323;border:1px solid var(--line);border-radius:12px}.project-head{display:flex;gap:16px;align-items:center}.preview{width:90px;height:70px;object-fit:cover;border-radius:8px;background:#222}.upload-row{display:flex;gap:10px;align-items:center}.upload-row input{flex:1}.savebar{position:fixed;z-index:8;right:28px;bottom:24px;display:flex;align-items:center;gap:14px;padding:12px;background:#11172a;border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px #0008}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:none}.two{grid-template-columns:1fr}.app header{align-items:flex-start}.header-actions{flex-wrap:wrap;justify-content:flex-end}main{padding:25px 16px 110px}.section{padding:20px}.savebar{left:16px;right:16px;bottom:14px;justify-content:space-between}}</style></head><body>
<section id="login" class="login"><form id="loginForm" class="card"><p class="brand">AURORANIK ADMIN</p><h1>관리자 로그인</h1><p class="hint">등록된 관리자 이메일과 비밀번호를 입력하세요.</p><div class="field"><label for="email">이메일</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label for="password">비밀번호</label><input id="password" type="password" required autocomplete="current-password"></div><button class="primary" type="submit">로그인</button><p id="loginStatus" class="status"></p></form></section>
<div id="app" class="app hidden"><header><div><div class="brand">AURORANIK</div><small class="hint">Content Manager</small></div><div class="header-actions"><a class="ghost" href="index.html" target="_blank">사이트 보기 ↗</a><button id="logout" class="danger">로그아웃</button></div></header><div class="layout"><aside><a href="#basic">기본 콘텐츠</a><a href="#links">문의 링크</a><a href="#projects">포트폴리오</a></aside><main>
<section id="basic" class="section"><h2>기본 콘텐츠</h2><div class="field"><label>메인 제목 (줄바꿈은 &lt;br&gt;, 강조는 &lt;em&gt;)</label><textarea id="heroTitle"></textarea></div><div class="field"><label>메인 소개</label><textarea id="heroLead"></textarea></div><div class="field"><label>브랜드 소개 제목</label><textarea id="aboutTitle"></textarea></div><div class="field"><label>브랜드 소개 본문</label><textarea id="aboutText"></textarea></div></section>
<section id="links" class="section"><h2>문의 링크</h2><div class="two"><div class="field"><label>카카오 오픈채팅</label><input id="kakaoUrl" type="url"></div><div class="field"><label>오로라닉 채널</label><input id="channelUrl" type="url"></div></div></section>
<section id="projects" class="section"><h2>포트폴리오</h2><p class="hint">이미지를 선택하면 Supabase Storage에 업로드됩니다.</p><div id="projectList"></div></section>
</main></div><div class="savebar"><span id="saveStatus" class="status">변경사항 없음</span><button id="save" class="primary">변경사항 저장</button></div></div>
<script>
const cfg=window.AURORANIK_CONFIG||{};let db=null,content=null;
const configured=cfg.supabaseUrl&&!cfg.supabaseUrl.startsWith('YOUR_')&&cfg.supabaseAnonKey&&!cfg.supabaseAnonKey.startsWith('YOUR_');
if(configured) db=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
const $=id=>document.getElementById(id);
function msg(id,text,error=false){$(id).textContent=text;$(id).style.color=error?'var(--danger)':'var(--muted)'}
async function checkAdmin(){const {data:{session}}=await db.auth.getSession();if(!session)return false;const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();return !error&&!!data}
async function openApp(){const ok=await checkAdmin();if(!ok){await db.auth.signOut();msg('loginStatus','관리자 권한이 없는 계정입니다.',true);return}$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadContent()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!configured){msg('loginStatus','config.js에 Supabase 연결값을 먼저 입력하세요.',true);return}msg('loginStatus','로그인 중...');const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){msg('loginStatus',error.message,true);return}await openApp()});
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function loadContent(){msg('saveStatus','콘텐츠 불러오는 중...');const {data,error}=await db.from('site_content').select('content').eq('id','main').single();if(error){msg('saveStatus',error.message,true);return}content=data.content;['heroTitle','heroLead','aboutTitle','aboutText','kakaoUrl','channelUrl'].forEach(k=>$(k).value=content[k]||'');renderProjects();msg('saveStatus','콘텐츠를 불러왔습니다.')}
function renderProjects(){$('projectList').innerHTML='';(content.projects||[]).forEach((p,i)=>{const el=document.createElement('article');el.className='project';el.innerHTML='<div class="project-head"><img class="preview" src="'+esc(p.image)+'" alt=""><div><b>프로젝트 '+(i+1)+'</b><div class="hint">'+esc(p.name)+'</div></div></div><div class="two"><div class="field"><label>프로젝트명</label><input data-i="'+i+'" data-k="name" value="'+esc(p.name)+'"></div><div class="field"><label>태그</label><input data-i="'+i+'" data-k="tags" value="'+esc(p.tags)+'"></div></div><div class="field"><label>설명</label><textarea data-i="'+i+'" data-k="description">'+esc(p.description)+'</textarea></div><div class="field"><label>이미지 URL</label><input data-i="'+i+'" data-k="image" value="'+esc(p.image)+'"></div><div class="upload-row"><input type="file" accept="image/*" data-upload="'+i+'"><button class="ghost" type="button" data-upload-btn="'+i+'">이미지 업로드</button></div>';$('projectList').appendChild(el)});document.querySelectorAll('[data-i]').forEach(x=>x.oninput=()=>{content.projects[+x.dataset.i][x.dataset.k]=x.value;msg('saveStatus','저장하지 않은 변경사항이 있습니다.')});document.querySelectorAll('[data-upload-btn]').forEach(b=>b.onclick=()=>uploadImage(+b.dataset.uploadBtn))}
function esc(s=''){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function uploadImage(i){const input=document.querySelector('[data-upload="'+i+'"]'),file=input.files[0];if(!file)return alert('이미지 파일을 선택하세요.');msg('saveStatus','이미지 업로드 중...');const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=Date.now()+'-'+i+'.'+ext;const {error}=await db.storage.from('portfolio-assets').upload(path,file,{upsert:false});if(error){msg('saveStatus',error.message,true);return}const {data}=db.storage.from('portfolio-assets').getPublicUrl(path);content.projects[i].image=data.publicUrl;renderProjects();msg('saveStatus','이미지가 업로드되었습니다. 저장 버튼을 누르세요.')}
$('save').onclick=async()=>{['heroTitle','heroLead','aboutTitle','aboutText','kakaoUrl','channelUrl'].forEach(k=>content[k]=$(k).value.trim());msg('saveStatus','저장 중...');const {error}=await db.from('site_content').update({content,updated_at:new Date().toISOString()}).eq('id','main');msg('saveStatus',error?error.message:'저장 완료 — 랜딩페이지에 반영되었습니다.',!!error)};
if(configured)db.auth.getSession().then(({data})=>{if(data.session)openApp()});else msg('loginStatus','config.js에 Supabase 연결값을 입력해야 합니다.',true);
</script></body></html>
